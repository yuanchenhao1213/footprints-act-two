,"assets/archive-wang-1.webp","assets/archive-wang-2.webp","assets/archive-wang-3.webp","assets/archive-wang-4.webp","assets/archive-wang-5.webp","assets/archive-wang-6.webp","assets/archive-wang-7.webp"],captions:["汪曾祺","汪曾祺","汪曾祺","1958年在张家口劳动时合影","联大期间与朱德熙、李荣合影","1961年与沈从文在中山公园","1961年全家在中山公园","1948年与夫人施松卿合影","1980年代末在家中写作","《羊舍一夕》手稿"],sources:["资料留影","资料留影","资料留影","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号"]},{name:"穆旦",city:"长沙",desc:"把苦难踩在脚下的诗人",questions:["您为什么要撕掉字典？","三千五百里，脚底很疼吧？","我们现在总在精神内耗，想得太多，做得太少。"],answers:["步行三千五百里太苦，边走边背英文单词。背熟一页，撕下一页。这不是毁书，是把知识嚼碎了，长进骨头里。","鞋底走穿，血泡叠着血泡。但雨声里，没人停下脚步。我们在用脚掌，丈量中国的重量。","内耗，往往是因为停在原地，想得太远。去吧，别困在焦虑里，把心里的苦，走成脚下的路。"],images:["assets/image7.jpeg","assets/image8.jpeg","assets/image9.jpeg","assets/archive-mudan-1.webp","assets/archive-mudan-2.webp","assets/archive-mudan-3.webp"],captions:["穆旦","穆旦","穆旦","穆旦资料肖像","南开大学东村旧居","穆旦与家人合影"],sources:["资料留影","资料留影","资料留影","南开大学新闻网转载《每日新报》（2018年11月17日）","南开大学新闻网转载《每日新报》（2018年11月17日）","南开大学新闻网转载《每日新报》（2018年11月17日）"]},{name:"三线建设者",city:"攀枝花",desc:"工人 · 技术人员 · 建设者家属",questions:["他们为什么奔赴西南？","艰苦的建设，靠什么共同撑起？","平凡的工作，留下了什么？"],answers:["他们从不同地方出发，把技术、劳动和生活带到西南。工人、技术人员与建设者家属，在陌生的山河间共同安家，把个人的脚步汇入建设的队伍。","勘测、施工、生产与生活保障，环环相扣。有人架桥修路，有人安装设备，也有人照料一家人的生活。建设的背后，是许多人彼此接力、共同承担。","一条路、一座桥、一间厂房，凝结着许多普通人的劳动。三线建设的群像，既在工业设施里，也在留在这里的家庭、技艺与记忆中。"],images:["assets/image10.jpeg","assets/image11.jpeg","assets/image12.jpeg"],captions:["建设者的劳动现场","山河间的建设现场","建设岁月的记忆"]}],$2={class:"masthead"},S2={class:"header-right"},k2={class:"chapter-heading"},E2={class:"chapter-context"},M2=["inert"],A2={key:0,class:"ending-note"},R2=["inert"],P2={class:"sr-only",role:"status"},O2={key:0,class:"era-transition",role:"status"},F2={class:"year-composition"},I2=["aria-label"],D2={key:3,class:"third-act-entry","aria-labelledby":"third-act-title"};d1({__name:"App",setup(e){const t=te(0),s=te(!1),n=te(58),i=te(0),r=te(null),o=te([[],[],[],[]]),l=te(null),a=te(!1),f=te(""),u=te(!1),h=te(""),
