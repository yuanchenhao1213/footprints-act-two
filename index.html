什么要撕掉字典？","三千五百里，脚底很疼吧？","我们现在总在精神内耗，想得太多，做得太少。"],answers:["步行三千五百里太苦，边走边背英文单词。背熟一页，撕下一页。这不是毁书，是把知识嚼碎了，长进骨头里。","鞋底走穿，血泡叠着血泡。但雨声里，没人停下脚步。我们在用脚掌，丈量中国的重量。","内耗，往往是因为停在原地，想得太远。去吧，别困在焦虑里，把心里的苦，走成脚下的路。"],images:["assets/image7.jpeg","assets/image8.jpeg","assets/image9.jpeg","assets/archive-mudan-1.webp","assets/archive-mudan-2.webp","assets/archive-mudan-3.webp"],captions:["穆旦","穆旦","穆旦","穆旦资料肖像","南开大学东村旧居","穆旦与家人合影"],sources:["资料留影","资料留影","资料留影","南开大学新闻网转载《每日新报》（2018年11月17日）","南开大学新闻网转载《每日新报》（2018年11月17日）","南开大学新闻网转载《每日新报》（2018年11月17日）"]},{name:"三线建设者",city:"攀枝花",desc:"工人 · 技术人员 · 建设者家属",questions:["他们为什么奔赴西南？","艰苦的建设，靠什么共同撑起？","平凡的工作，留下了什么？"],answers:["他们从不同地方出发，把技术、劳动和生活带到西南。工人、技术人员与建设者家属，在陌生的山河间共同安家，把个人的脚步汇入建设的队伍。","勘测、施工、生产与生活保障，环环相扣。有人架桥修路，有人安装设备，也有人照料一家人的生活。建设的背后，是许多人彼此接力、共同承担。","一条路、一座桥、一间厂房，凝结着许多普通人的劳动。三线建设的群像，既在工业设施里，也在留在这里的家庭、技艺与记忆中。"],images:["assets/image10.jpeg","assets/image11.jpeg","assets/image12.jpeg"],captions:["建设者的劳动现场","山河间的建设现场","建设岁月的记忆"]}],y1=["inert","aria-hidden"],v1={key:0,class:"exploration-guide","aria-labelledby":"exploration-guide-title"},b1={class:"guide-steps"},x1={class:"guide-step-number","aria-hidden":"true"},w1={key:1,class:"industry-guide","aria-labelledby":"industry-guide-title"},_1={class:"industry-step-number"},$1={key:2,class:"industry-photo-reveal"},C1={class:"industry-frame"},k1={key:3,class:"portrait-anchor-layer"},S1={class:"portrait-leaders",viewBox:"0 0 1983 793",preserveAspectRatio:"none","aria-hidden":"true"},T1=["d"],M1=["aria-label","onClick"],E1={class:"portrait-motion"},A1={class:"portrait-frame"},R1={class:"portrait-mat"},P1=["src","alt"],O1={class:"portrait-caption"},F1=ps({__name:"MapExploreOverlay",props:{visible:Boolean,entering:Boolean,returning:Boolean,paused:Boolean,phase:Number,settled:Boolean},emits:["open"],setup(e){const t=[{city:"beiping",index:0,x:58.25,y:9.7,delay:"-1.5s",line:"M1250 163 L1353 204"},{city:"shanghai",index:1,x:82.2,y:40.1,delay:"-4s",line:"M1510 410 L1630 361"},{city:"changsha",index:2,
