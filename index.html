场朝圣，去奔赴久仰的师友","险些掉进海里。但到了昆明，听见图书馆的钟声，就知道一切都值得。","我也走过旁人眼里不划算的路。但正是那段漂泊，喂养了我一生的文学。别怕绕远路，在未来，你会恍然发现远路的意义"],images:["assets/image4.jpeg","assets/image5.jpeg","assets/image6.jpeg"]},{name:"穆旦",city:"长沙",desc:"把苦难踩在脚下的诗人",questions:["您为什么要撕掉字典？","三千五百里，脚底很疼吧？","我们现在总在精神内耗，想得太多，做得太少。"],answers:["步行三千五百里太苦，边走边背英文单词。背熟一页，撕下一页。这不是毁书，是把知识嚼碎了，长进骨头里。","鞋底走穿，血泡叠着血泡。但雨声里，没人停下脚步。我们在用脚掌，丈量中国的重量。","内耗，往往是因为停在原地，想得太远。去吧，别困在焦虑里，把心里的苦，走成脚下的路。"],images:["assets/image7.jpeg","assets/image8.jpeg","assets/image9.jpeg"]},{name:"三线建设者",city:"攀枝花",desc:"工人 · 技术人员 · 建设者家属",questions:["他们为什么奔赴西南？","艰苦的建设，靠什么共同撑起？","平凡的工作，留下了什么？"],answers:["他们从不同地方出发，把技术、劳动和生活带到西南。工人、技术人员与建设者家属，在陌生的山河间共同安家，把个人的脚步汇入建设的队伍。","勘测、施工、生产与生活保障，环环相扣。有人架桥修路，有人安装设备，也有人照料一家人的生活。建设的背后，是许多人彼此接力、共同承担。","一条路、一座桥、一间厂房，凝结着许多普通人的劳动。三线建设的群像，既在工业设施里，也在留在这里的家庭、技艺与记忆中。"],images:["assets/image10.jpeg","assets/image11.jpeg","assets/image12.jpeg"],captions:["建设者的劳动现场","山河间的建设现场","建设岁月的记忆"]}],kL={class:"masthead"},SL={class:"header-right"},ML={class:"chapter-heading"},TL={class:"chapter-context"},AL=["inert"],EL={key:0,class:"ending-note"},PL=["inert"],OL={class:"sr-only",role:"status"},RL={key:0,class:"era-transition",role:"status"},FL={class:"year-composition"},IL=["aria-label"],DL={key:3,class:"third-act-entry","aria-labelledby":"third-act-title"};d1({__name:"App",setup(e){const t=J(0),s=J(!1),n=J(58),i=J(0),r=J(null),o=J([[],[],[],[]]),l=J(null),L=J(!1),f=J(""),c=J(!1),h=J(""),m=J(null),x=J(!1),k=J(!1),M=J(""),Z=J(!1);let B=0,j,V;function I(){M.value="in",V=setTimeout(()=>{M.value=""},2e3)}function Y(){clearTimeout(j),clearTimeout(V),k.value=!1,M.value=""}let ie,ne,re,z=[];const G=J(!1);let Q,v,O;function D(){z.forEach(clearTimeout),z=[]}function b(){h.value||(s.value=!1,h.value="gathering",z=[setTimeout(()=>{h.value="glow"},6e3),setTimeout(()=>{h.value="fading"},7500),setTimeout(()=>{h.value="quiet"},10500),setTimeout(()=>Le(1),12e3)])}function y(){f.value||(s.value=!1,f.value="gathering",z=[setTimeout(()=>{f.value="bloom"},6e3),set
