《郑天挺西南联大日记》（中华书局，2018年）","《郑天挺西南联大日记》（中华书局，2018年）","《郑天挺西南联大日记》（中华书局，2018年）","《郑天挺西南联大日记》（中华书局，2018年）"]},{name:"汪曾祺",audio:["assets/shanghai-answer-1.wav","assets/shanghai-answer-2.wav","assets/shanghai-answer-3.wav"],city:"上海",desc:"绕道追梦的少年",questions:["您为什么要绕道去昆明？","走了这么远，值得吗？","如果我想走一条别人都说“不划算”的路，您支持吗？"],answers:["1939年夏天，我从上海出发，经香港、海防，再乘滇越铁路去昆明。那时我想报考西南联大。","昆明的课堂和书，后来成了我生命中重要的一部分。路途遥远，终点却是一扇新的门。","我走过旁人眼里不划算的路。正是那段漂泊，喂养了我一生的文学。别怕绕远路，在未来，你会恍然发现远路的意义。"],images:["assets/image4.jpeg","assets/image5.jpeg","assets/image6.jpeg","assets/archive-wang-1.webp","assets/archive-wang-2.webp","assets/archive-wang-3.webp","assets/archive-wang-4.webp","assets/archive-wang-5.webp","assets/archive-wang-6.webp","assets/archive-wang-7.webp"],captions:["汪曾祺","汪曾祺","汪曾祺","1958年在张家口劳动时合影","联大期间与朱德熙、李荣合影","1961年与沈从文在中山公园","1961年全家在中山公园","1948年与夫人施松卿合影","1980年代末在家中写作","《羊舍一夕》手稿"],sources:["资料留影","资料留影","资料留影","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号","人民文学出版社公众号"]},{name:"穆旦",city:"长沙",desc:"把苦难踩在脚下的诗人",questions:["路上还想着读书吗？","漫长的路怎样走完？","现在总是想得多、做得少，怎么办？"],answers:["一路艰辛，许多青年学生带着书和字典。路走得很远，读书这件事却始终没有停。","随湘黔滇旅行团从长沙启程，穿过湘西、贵州，直到四月下旬抵达昆明。一步接着一步，就这样走过了山河。","内耗，往往是因为停在原地，想得太远。去吧，别困在焦虑里，把心里的苦，走成脚下的路。"],images:["assets/image7.jpeg","assets/image8.jpeg","assets/image9.jpeg","assets/archive-mudan-1.webp","assets/archive-mudan-2.webp","assets/archive-mudan-3.webp"],captions:["穆旦","穆旦","穆旦","穆旦资料肖像","南开大学东村旧居","穆旦与家人合影"],sources:["资料留影","资料留影","资料留影","南开大学新闻网转载《每日新报》（2018年11月17日）","南开大学新闻网转载《每日新报》（2018年11月17日）","南开大学新闻网转载《每日新报》（2018年11月17日）"],audio:["assets/mu-dan-01.mp3","assets/mu-dan-02.mp3","assets/mu-dan-03.mp3"]},{name:"三线建设者",city:"攀枝花",desc:"工人 · 技术人员 · 建设者家属",questions:["他们为什么奔赴西南？","艰苦的建设，靠什么共同撑起？","平凡的工作，留下了什么？"],answers:["他们从不同地方出发，把技术、劳动和生活带到西南。工人、技术人员与建设者家属，在陌生的山河间共同安家，把个人的脚步汇入建设的队伍。","勘测、施工、生产与生活保障，环环相扣。有人架桥修路，有人安装设备，也有人照料一家人的生活。建设的背后，是许多人彼此接力、共同承担。","一条路、一座桥、一间厂房，凝结着许多普通人的劳动。三线建设的群像，既在工业设施里，也在留在这里的家庭、技艺与记忆中。"],images:["assets/image10.jpeg","ass
